name: zed e2e (two-source Python consumer)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: 7e5ac1897a872223f8316ef1c3342a2fa1982504
  ZED_INTERFACES_REF: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
  POLYGLOT_REF: 998964aa58e49595547650b4a8da407b7a2283a9
  SHARED_SCHEMA_REF: 41cec5076791555d4b72e72da0a42888da0522d0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: ${{ env.POLYGLOT_REF }}
          path: polyglot-lib
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/shared-schema
          ref: ${{ env.SHARED_SCHEMA_REF }}
          path: shared-schema
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: app/.github/workflows/zed-e2e.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Build exact Zed CLI
        run: cargo build --locked --release --bin zed --manifest-path zed-cli/Cargo.toml
      - name: Configure hermetic registry
        run: |
          {
            echo "ZED=$GITHUB_WORKSPACE/zed-cli/target/release/zed"
            echo "ZED_PKG_REGISTRY=file://$RUNNER_TEMP/zed-reg"
            echo "ZED_PKG_HOME=$RUNNER_TEMP/zed-home"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zed-reg" "$RUNNER_TEMP/zed-home"
      - name: Import fails before Zed installation
        working-directory: app
        run: |
          if ZED_SHARED_SCHEMA_PATH=/nonexistent python main.py; then
            echo '::error::polyglot_lib resolved before Zed install' >&2
            exit 1
          fi
      - name: Publish both immutable source repositories
        run: |
          set -euo pipefail
          (cd polyglot-lib && "$ZED" publish --skip-vcs-checks)
          (cd shared-schema && "$ZED" publish --skip-vcs-checks)
      - name: Symlink install executes both sources
        working-directory: app
        run: |
          set -euo pipefail
          "$ZED" install --install-mode symlink
          test -L .vendor/.zed/zedtest/polyglot-lib-python
          test -L .vendor/.zed/zedtest/shared-schema
          export PYTHONPATH="$(cat .zed/python_path)"
          export ZED_SHARED_SCHEMA_PATH="$PWD/.vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json"
          python main.py | tee "$RUNNER_TEMP/python-app.log"
          grep -q 'OK: both Zed source packages resolved' "$RUNNER_TEMP/python-app.log"
      - name: Frozen copy install is self-contained
        working-directory: app
        run: |
          set -euo pipefail
          "$ZED" install --frozen --install-mode copy
          test -z "$(find .vendor/.zed -type l -print -quit)"
          export PYTHONPATH="$(cat .zed/python_path)"
          export ZED_SHARED_SCHEMA_PATH="$PWD/.vendor/.zed/zedtest/shared-schema/schemas/job-envelope.schema.json"
          python main.py
          python - <<'PY'
          import json
          from pathlib import Path
          paths = json.loads(Path('.zed/paths.json').read_text())
          names = {item['package'] for item in paths['packages']}
          assert {'zedtest/polyglot-lib-python', 'zedtest/shared-schema'} <= names
          PY
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-python-two-source-log
          path: ${{ runner.temp }}/python-app.log
          if-no-files-found: warn
          retention-days: 7
